    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Figtree', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .antialiased { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
        ._titlefont_10rv6_3 { font-family: 'Times New Roman', 'Georgia', serif; letter-spacing: 0.05em; }
        @keyframes slideIn { 0% { transform: translateX(100%); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(100%); opacity: 0; } }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: slideOut 0.3s ease-in forwards; }
        @keyframes btnSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-spinner { animation: btnSpin 0.6s linear infinite; }
        .page-card { transition: all 0.2s ease; }
        .page-card:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
    </style>
</head>
<body class="sans-serif antialiased bg-gray-50">
    <div id="app">
        <div class="bg-white min-h-screen flex flex-col">
            <!-- HEADER -->
            <header class="min-h-[100px] pt-2 border-b border-gray-100">
                <div class="flex justify-between mx-4">
                    <img src="https://z-cdn-media.chatglm.cn/files/7c01c992-a24a-4a1e-bbc4-0a37a6e24138.png?auth_key=1882425082-85486a719eef47279781d250284a2a61-0-808f1456391cc42f94ccb9f2273b0665" class="mt-2" alt="" width="200">
                </div>
            </header>

            <!-- MAIN CONTENT with 20 pages -->
            <main class="flex-grow container mx-auto px-4 py-6">
                <!-- Apostille Section (stays as is) -->
                <div class="mb-8">
                    <div class="text-xl md:text-2xl p-3 mb-3">
                        <p class="font-semibold">অ্যাপোস্টিল</p>
                    </div>
                    <div class="flex items-center font-sans">
                        <div class="p-2 rounded-md border-2 bg-white w-full max-w-2xl">
                            <div class="w-full">
                                <div class="mb-4 flex justify-center">
                                    <img src="https://res.cloudinary.com/jvc6fbo2/image/upload/v1786914069/Farhan_ip.jpg" alt="E-Apostille Certificate" class="w-full rounded">
                                </div>
                            </div>
                            <div class="flex justify-end mr-8">
                                <button id="download-btn" class="inline-flex items-center px-4 py-2 bg-gray-800 border border-transparent rounded-md font-semibold text-sm text-white uppercase tracking-widest hover:bg-gray-700 focus:bg-gray-700 active:bg-gray-900 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition ease-in-out duration-150">
                                    <svg id="btn-icon-download" stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 512 512" class="mr-4" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M216 0h80c13.3 0 24 10.7 24 24v168h87.7c17.8 0 26.7 21.5 14.1 34.1L269.7 378.3c-7.5 7.5-19.8 7.5-27.3 0L90.1 226.1c-12.6-12.6-3.7-34.1 14.1-34.1H192V24c0-13.3 10.7-24 24-24zm296 376v112c0 13.3-10.7 24-24 24H24c-13.3 0-24-10.7-24-24V376c0-13.3 10.7-24 24-24h146.7l49 49c20.1 20.1 52.5 20.1 72.6 0l49-49H488c13.3 0 24 10.7 24 24zm-124 88c0-11-9-20-20-20s-20 9-20 20 9 20 20 20 20-9 20-20zm64 0c0-11-9-20-20-20s-20 9-20 20 9 20 20 20 20-9 20-20z"></path>
                                    </svg>
                                    <svg id="btn-icon-spinner" class="mr-4 btn-spinner hidden" stroke="currentColor" fill="none" stroke-width="0" viewBox="0 0 24 24" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg">
                                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" stroke-dasharray="31.416" stroke-dashoffset="10" stroke-linecap="round"></circle>
                                    </svg>
                                    <span id="btn-text">অ্যাপোস্টিল ডাউনলোড</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <hr class="my-6">

                <!-- CERTIFICATES SECTION - 20 PAGES -->
                <div class="pb-8">
                    <div class="w-full">
                        <div class="text-xl md:text-2xl p-3 my-5">
                            <p class="font-semibold">সনদপত্র/নম্বরপত্র/একাডেমিক ট্রান্সক্রিপ্ট/ডকুমেন্টস</p>
                            <p class="text-sm text-gray-500 mt-1">মোট ২০টি পৃষ্ঠা (প্রতিটি স্বতন্ত্র সনদ)</p>
                        </div>

                        <!-- 20 Pages Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            <!-- Page 1 to 20 (repeating with slight variations) -->
                            <!-- We use a loop in the JavaScript to generate these dynamically, 
                                 but we also pre-render the first one as a placeholder.
                                 However to keep it clean, we generate all 20 via JS -->
                            <div id="page-container" class="col-span-full">
                                <!-- Will be populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- FOOTER -->
            <footer class="w-full bg-[#f3f3f9] border-t border-[#dfdfe2] mt-8">
                <div class="flex flex-row flex-wrap justify-center sm:justify-between gap-4 px-6 py-2">
                    <div class="flex items-center">
                        <img src="https://z-cdn-media.chatglm.cn/files/e0f2cd17-9401-4d4d-8d51-df271506e327.png?auth_key=1882425082-1a1855909a0e48e79d18adfd2497077d-0-991d5e3e16817d503e3002687350e16f" class="h-12 rounded-2xl" alt="">
                        <div>
                            <p class="text-[16px] mx-4">কপিরাইট © ২০২৫ সর্বস্বত্ব সংরক্ষিত</p>
                            <p class="text-[16px] mx-4">গণপ্রজাতন্ত্রী বাংলাদেশ সরকার</p>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <span class="text-[16px] mx-6">পরিকল্পনা বাস্তবায়নে</span>
                        <img src="https://z-cdn-media.chatglm.cn/files/5ed18449-9e2b-4690-b3eb-f1400ad7b629.png?auth_key=1882425082-17763ba5c0ca441781c47f1ef5d336cd-0-0dced930f66393adf7bb7d4fc736e486" class="h-10 " alt="">
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toast-container" class="fixed top-6 right-6 z-[9999] flex flex-col gap-3" style="pointer-events: none;"></div>

    <!-- SCRIPTS -->
    <script>
        // Toast function
        function showToast(message, type) {
            var container = document.getElementById('toast-container');
            var toast = document.createElement('div');
            toast.style.pointerEvents = 'auto';
            var bgColor = type === 'error' ? 'bg-red-600' : 'bg-green-600';
            var iconSvg = type === 'error'
                ? '<svg stroke="currentColor" fill="none" stroke-width="0" viewBox="0 0 24 24" class="w-5 h-5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>'
                : '<svg stroke="currentColor" fill="none" stroke-width="0" viewBox="0 0 24 24" class="w-5 h-5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
            toast.className = 'toast-enter flex items-start gap-3 px-5 py-4 rounded-lg shadow-2xl text-white text-sm max-w-sm ' + bgColor;
            toast.innerHTML = iconSvg + '<span class="leading-snug">' + message + '</span>';
            container.appendChild(toast);
            setTimeout(function() {
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-exit');
                toast.addEventListener('animationend', function() {
                    if (toast.parentNode) toast.parentNode.removeChild(toast);
                });
            }, 4000);
        }

        // Download button logic (unchanged)
        var downloadBtn = document.getElementById('download-btn');
        var btnIconDownload = document.getElementById('btn-icon-download');
        var btnIconSpinner = document.getElementById('btn-icon-spinner');
        var btnText = document.getElementById('btn-text');

        downloadBtn.addEventListener('click', function() {
            downloadBtn.disabled = true;
            downloadBtn.classList.add('opacity-70', 'cursor-not-allowed');
            downloadBtn.classList.remove('hover:bg-gray-700', 'focus:bg-gray-700', 'active:bg-gray-900');
            btnIconDownload.classList.add('hidden');
            btnIconSpinner.classList.remove('hidden');
            btnText.textContent = 'Downloading...';
            setTimeout(function() {
                downloadBtn.disabled = false;
                downloadBtn.classList.remove('opacity-70', 'cursor-not-allowed');
                downloadBtn.classList.add('hover:bg-gray-700', 'focus:bg-gray-700', 'active:bg-gray-900');
                btnIconDownload.classList.remove('hidden');
                btnIconSpinner.classList.add('hidden');
                btnText.textContent = 'অ্যাপোস্টিল ডাউনলোড';
                showToast('Server Error: Failed to download the document. The server encountered an internal error and was unable to complete your request. Please try again later.', 'error');
            }, 2000);
        });

        // ===================== GENERATE 20 PAGES =====================
        function generatePages() {
            const container = document.getElementById('page-container');
            container.innerHTML = ''; // clear any placeholder

            // Base data (images and signature from original)
            const mainImage = "https://res.cloudinary.com/jvc6fbo2/image/upload/v1786911906/Farhan_pcc.jpg";
            const signatureImage = "https://i.ibb.co.com/fYdRPwcQ/Singh.jpg";
            const baseName = "Rounaq Jahan";
            const baseTitle = "Superintendent of Police";
            const baseLocation = "Shariatpur";
            const baseDate = "16 AUG 2026";

            // Create a wrapper with grid
            const grid = document.createElement('div');
            grid.className = 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6';

            // Generate 20 pages (i from 1 to 20)
            for (let i = 1; i <= 20; i++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'page-card bg-white border-2 rounded-md p-4 shadow-sm hover:shadow-md transition-all';

                // Slight variation: different serial or subtle change (e.g., date increment, document number)
                const serial = String(i).padStart(2, '0');
                const docNumber = `BD-APO-${String(100 + i).padStart(3, '0')}`;
                // Make date slightly different for some pages (just for demonstration)
                let displayDate = baseDate;
                if (i % 3 === 0) displayDate = `16 AUG 2026`; 
                else if (i % 3 === 1) displayDate = `17 AUG 2026`;
                else displayDate = `18 AUG 2026`;

                // Person name can vary slightly for realism
                let personName = baseName;
                if (i % 4 === 0) personName = "Rounaq Jahan";
                else if (i % 4 === 1) personName = "Rounaq Jahan";
                else if (i % 4 === 2) personName = "Rounaq Jahan";
                else personName = "Rounaq Jahan";

                // Build inner HTML
                pageDiv.innerHTML = `
                    <div class="flex justify-end mb-1">
                        <span class="text-xs font-bold text-gray-400 bg-gray-100 px-2 py-1 rounded-full">#${serial}</span>
                    </div>
                    <img src="${mainImage}" alt="Document ${serial}" class="w-full rounded border border-gray-200 mb-3">
                    <div class="flex flex-col items-center px-2 py-3 border-t border-gray-100">
                        <h2 class="_titlefont_10rv6_3 text-purple-900 font-extrabold text-lg"> Attested </h2>
                        <div class="flex items-center justify-center my-2">
                            <img src="${signatureImage}" alt="Signature" class="h-12 ml-3">
                        </div>
                        <p class="text-md font-semibold text-purple-800">${displayDate}</p>
                        <p class="text-purple-900 text-center font-medium text-sm">${personName}</p>
                        <p class="text-purple-900 text-center font-medium text-sm">${baseTitle}</p>
                        <p class="text-purple-900 text-center font-medium text-sm">${baseLocation}</p>
                        <p class="text-xs text-gray-400 mt-1">Doc: ${docNumber}</p>
                    </div>
                `;
                grid.appendChild(pageDiv);
            }
            container.appendChild(grid);
        }

        // Initialize pages on load
        document.addEventListener('DOMContentLoaded', generatePages);
    </script>

</body>
</html>
